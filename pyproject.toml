[project]
name = "ai-developer-hw"
version = "0.1.0"
description = "AI Developer homework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai (>=1.50,<3.0)",
    "python-dotenv (>=1.0,<2.0)",
    "pydantic (>=2.7,<3.0)",
    "fastapi (>=0.110,<1.0)",
    "uvicorn (>=0.29,<1.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
